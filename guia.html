<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Despacho | LukeAPP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --dark: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: var(--dark);
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            border: 1px solid var(--border);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            margin: 0;
            color: var(--primary);
            font-size: 24px;
        }

        .logo-section p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #64748b;
        }

        .guia-info {
            text-align: right;
        }

        .guia-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .meta-item label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .meta-item p {
            margin: 0;
            font-weight: 500;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            background: #f1f5f9;
            padding: 12px;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .footer {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qr-code {
            width: 100px;
            height: 100px;
            background: #eee;
        }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        @media print {
            .print-btn {
                display: none;
            }

            body {
                padding: 0;
                background: white;
            }

            .container {
                box-shadow: none;
                border: none;
                width: 100%;
                max-width: none;
            }
        }
    </style>
</head>

<body>
    <button class="print-btn" onclick="window.print()">🖨️ Imprimir Guía</button>

    <div class="container">
        <header class="header">
            <div class="logo-section">
                <h1>ANDINA PIPING</h1>
                <p>Spool Logistics Management System</p>
            </div>
            <div class="guia-info">
                <div class="guia-number" id="guia-id">Cargando...</div>
                <p id="guia-fecha">--/--/----</p>
            </div>
        </header>

        <section class="meta-grid">
            <div class="meta-item">
                <label>Origen</label>
                <p id="guia-origen">--</p>
            </div>
            <div class="meta-item">
                <label>Destino</label>
                <p id="guia-destino">--</p>
            </div>
            <div class="meta-item">
                <label>Empresa Emisora</label>
                <p id="guia-emisor">--</p>
            </div>
            <div class="meta-item">
                <label>Tipo de Guía</label>
                <p id="guia-tipo">--</p>
            </div>
        </section>

        <table>
            <thead>
                <tr>
                    <th>TAG Spool</th>
                    <th>ID ISO</th>
                    <th>NPS</th>
                    <th>Peso (kg)</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="spools-table">
                <!-- Se llenará dinámicamente -->
            </tbody>
        </table>

        <footer class="footer">
            <div class="signatures">
                <div style="border-top: 1px solid #000; margin-top: 50px; width: 200px; text-align: center;">
                    <p style="font-size: 12px;">Firma Despacho</p>
                </div>
            </div>
            <div id="qr-container">
                <!-- QR generado -->
            </div>
        </footer>
    </div>

    <script>
        const guiaId = window.location.pathname.split('/').pop();

        async function loadGuiaData() {
            try {
                // Fetch data from our local proxy API
                const response = await fetch(`/api/guia/${guiaId}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                const { guia, spools } = data;

                // Fill Header
                document.getElementById('guia-id').textContent = `GUÍA N° ${guia.NUM_GUIA || guiaId}`;
                document.getElementById('guia-fecha').textContent = guia.FECHA || '';
                document.getElementById('guia-origen').textContent = guia.ORIGEN || 'Taller Andina';
                document.getElementById('guia-destino').textContent = guia.DESTINO || 'Cancha Terreno';
                document.getElementById('guia-emisor').textContent = guia.EMPRESA_EMISORA || 'LukeAPP Logistics';
                document.getElementById('guia-tipo').textContent = guia.TIPO_GUIA || 'INTERNA';

                // Fill Spools
                const tableBody = document.getElementById('spools-table');
                spools.forEach(s => {
                    const row = `
                        <tr>
                            <td><strong>${s.TAG_SPOOL || s.ID_SPOOL}</strong></td>
                            <td>${s.ID_ISO || '--'}</td>
                            <td>${s.DIAMETRO || '--'}</td>
                            <td>${s.PESO_KG || '--'}</td>
                            <td><span style="color: #16a34a; font-weight: bold;">DESPACHADO</span></td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

                // Generate QR
                const qrUrl = `https://chart.googleapis.com/chart?chs=150x150&cht=qr&chl=${encodeURIComponent(window.location.href)}&choe=UTF-8`;
                document.getElementById('qr-container').innerHTML = `<img src="${qrUrl}" alt="QR de seguimiento" />`;

            } catch (err) {
                console.error(err);
                document.getElementById('guia-id').textContent = "ERROR AL CARGAR";
            }
        }

        loadGuiaData();
    </script>
</body>

</html>
