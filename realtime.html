<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUKE IWP — Asistente de Terreno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --bg-card: rgba(18, 26, 47, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-blue: #00d2ff;
            --accent-purple: #7928ca;
            --accent-green: #00e676;
            --accent-amber: #ffab00;
            --accent-red: #ff3d71;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.12), transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(121, 40, 202, 0.08), transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 1rem;
            overflow-x: hidden;
        }

        /* Top Header */
        header {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .brand-info h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .brand-info span {
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .status-badge.connected .status-dot {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-badge.listening .status-dot {
            background-color: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
            animation: pulse-dot 1.2s infinite ease-in-out;
        }

        .status-badge.thinking .status-dot {
            background-color: var(--accent-amber);
            box-shadow: 0 0 10px var(--accent-amber);
            animation: pulse-dot 0.8s infinite ease-in-out;
        }

        .status-badge.speaking .status-dot {
            background-color: var(--accent-purple);
            box-shadow: 0 0 12px var(--accent-purple);
            animation: pulse-dot 0.6s infinite ease-in-out;
        }

        .status-badge.error .status-dot {
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        /* Main Container */
        main {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            margin: auto 0;
        }

        /* Visualizer Container */
        .visualizer-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn-pulse-1, .mic-btn-pulse-2 {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.2) 0%, rgba(121, 40, 202, 0.05) 70%, transparent 100%);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .visualizer-container.listening .mic-btn-pulse-1 {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .visualizer-container.listening .mic-btn-pulse-2 {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 0.6s;
        }

        .visualizer-container.speaking .mic-btn-pulse-1 {
            background: radial-gradient(circle, rgba(121, 40, 202, 0.3) 0%, rgba(0, 210, 255, 0.1) 70%, transparent 100%);
            animation: pulse-ring-fast 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.7); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @keyframes pulse-ring-fast {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Mic Button */
        .mic-button {
            position: relative;
            z-index: 10;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(145deg, rgba(20, 30, 55, 0.9), rgba(10, 16, 32, 0.95));
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 2px 5px rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .mic-button:hover {
            transform: scale(1.04);
            border-color: var(--accent-blue);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-icon {
            font-size: 3rem;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.3));
        }

        .visualizer-container.active .mic-button {
            border-color: var(--accent-blue);
            box-shadow: 
                0 0 30px rgba(0, 210, 255, 0.35),
                inset 0 2px 10px rgba(0, 210, 255, 0.3);
        }

        .visualizer-container.speaking .mic-button {
            border-color: var(--accent-purple);
            box-shadow: 
                0 0 35px rgba(121, 40, 202, 0.4),
                inset 0 2px 10px rgba(121, 40, 202, 0.3);
        }

        /* Status Label */
        .status-text-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .status-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .status-sub {
            font-size: 0.88rem;
            color: var(--text-secondary);
            min-height: 1.35em;
        }

        /* Conversation Card (Clean & Formal) */
        .conversation-card {
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 1.2rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .conversation-header {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-stream {
            font-size: 0.9rem;
            line-height: 1.5;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 160px;
            scroll-behavior: smooth;
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 90%;
            word-break: break-word;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(0, 150, 255, 0.15));
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.luke {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        /* Footer */
        footer {
            width: 100%;
            max-width: 440px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.5rem 0;
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        #remote-audio {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="remote-audio" autoplay></audio>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-logo">L</div>
            <div class="brand-info">
                <h1>LUKE REALTIME</h1>
                <span>Asistente de Terreno</span>
            </div>
        </div>
        <div class="status-badge" id="status-badge">
            <div class="status-dot"></div>
            <span id="badge-text">Desconectado</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Visualizer & Mic Button -->
        <div class="visualizer-container" id="visualizer">
            <div class="mic-btn-pulse-1"></div>
            <div class="mic-btn-pulse-2"></div>
            <button class="mic-button" id="mic-btn" aria-label="Hablar con Luke">
                <span class="mic-icon" id="mic-icon">🎙️</span>
            </button>
        </div>

        <!-- Status Text -->
        <div class="status-text-container">
            <div class="status-title" id="status-title">Presiona para Hablar</div>
            <div class="status-sub" id="status-sub">Haz clic para iniciar la sesión de voz con Luke</div>
        </div>

        <!-- Conversation Stream -->
        <div class="conversation-card">
            <div class="conversation-header">
                Conversación en Terreno
            </div>
            <div class="chat-stream" id="chat-stream">
                <div class="chat-bubble luke">Hola, soy Luke. Presiona el micrófono para consultarme sobre cualquier spool del proyecto.</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <span>Andina Dashboard &bull; IWP</span>
        <a href="/">Volver al Dashboard &rarr;</a>
    </footer>

    <script>
        // Referencias DOM
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const visualizer = document.getElementById('visualizer');
        const statusBadge = document.getElementById('status-badge');
        const badgeText = document.getElementById('badge-text');
        const statusTitle = document.getElementById('status-title');
        const statusSub = document.getElementById('status-sub');
        const chatStream = document.getElementById('chat-stream');
        const remoteAudio = document.getElementById('remote-audio');

        // Estado WebRTC
        let peerConnection = null;
        let dataChannel = null;
        let localMediaStream = null;
        let isSessionActive = false;

        function addBubble(text, sender = 'luke') {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`;
            bubble.innerText = text;
            chatStream.appendChild(bubble);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function setUIState(state, subText = '') {
            statusBadge.className = 'status-badge ' + state;

            switch (state) {
                case 'disconnected':
                    badgeText.innerText = 'Desconectado';
                    statusTitle.innerText = 'Presiona para Hablar';
                    statusSub.innerText = subText || 'Haz clic para iniciar la sesión de voz con Luke';
                    visualizer.className = 'visualizer-container';
                    micIcon.innerText = '🎙️';
                    break;
                case 'connecting':
                    badgeText.innerText = 'Conectando...';
                    statusTitle.innerText = 'Estableciendo Enlace';
                    statusSub.innerText = subText || 'Iniciando canal de voz de alta velocidad...';
                    visualizer.className = 'visualizer-container active';
                    micIcon.innerText = '⏳';
                    break;
                case 'connected':
                case 'listening':
                    badgeText.innerText = 'Escuchando';
                    statusTitle.innerText = 'Te escucho...';
                    statusSub.innerText = subText || 'Puedes hablar naturalmente (ej: "Luke, háblame del spool 245")';
                    visualizer.className = 'visualizer-container listening active';
                    micIcon.innerText = '🎙️';
                    break;
                case 'thinking':
                    badgeText.innerText = 'Consultando';
                    statusTitle.innerText = 'Buscando información...';
                    statusSub.innerText = subText || 'Consultando datos del proyecto en tiempo real...';
                    visualizer.className = 'visualizer-container active';
                    micIcon.innerText = '🔍';
                    break;
                case 'speaking':
                    badgeText.innerText = 'Luke Hablando';
                    statusTitle.innerText = 'Luke respondiendo';
                    statusSub.innerText = subText || 'Escuchando respuesta por voz...';
                    visualizer.className = 'visualizer-container speaking active';
                    micIcon.innerText = '🔊';
                    break;
                case 'error':
                    badgeText.innerText = 'Error';
                    statusTitle.innerText = 'Error de Conexión';
                    statusSub.innerText = subText || 'No se pudo conectar. Intenta nuevamente.';
                    visualizer.className = 'visualizer-container';
                    micIcon.innerText = '⚠️';
                    break;
            }
        }

        micBtn.addEventListener('click', () => {
            if (isSessionActive) {
                stopRealtimeSession();
            } else {
                startRealtimeSession();
            }
        });

        async function startRealtimeSession() {
            setUIState('connecting');

            try {
                localMediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                peerConnection = new RTCPeerConnection();

                peerConnection.ontrack = (event) => {
                    remoteAudio.srcObject = event.streams[0];
                };

                localMediaStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localMediaStream);
                });

                dataChannel = peerConnection.createDataChannel('oai-events');
                setupDataChannel(dataChannel);

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                const sdpResponse = await fetch('/api/realtime/session', {
                    method: 'POST',
                    body: offer.sdp,
                    headers: { 'Content-Type': 'application/sdp' }
                });

                if (!sdpResponse.ok) {
                    const errText = await sdpResponse.text();
                    throw new Error(errText || 'Error al conectar con el servidor');
                }

                const answerSdp = await sdpResponse.text();
                await peerConnection.setRemoteDescription({
                    type: 'answer',
                    sdp: answerSdp
                });

                isSessionActive = true;
                setUIState('listening');

            } catch (err) {
                console.error('[Realtime Error]', err);
                setUIState('error', err.message);
                stopRealtimeSession();
            }
        }

        function setupDataChannel(dc) {
            dc.onmessage = async (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleRealtimeEvent(msg);
                } catch (e) {}
            };
        }

        async function handleRealtimeEvent(event) {
            switch (event.type) {
                case 'input_audio_buffer.speech_started':
                    setUIState('listening');
                    break;

                case 'input_audio_buffer.speech_stopped':
                    setUIState('thinking');
                    break;

                case 'response.audio_transcript.delta':
                    setUIState('speaking');
                    break;

                case 'response.audio_transcript.done':
                    if (event.transcript) {
                        addBubble(event.transcript, 'luke');
                    }
                    setUIState('listening');
                    break;

                case 'conversation.item.input_audio_transcription.completed':
                    if (event.transcript) {
                        addBubble(event.transcript, 'user');
                    }
                    break;

                case 'response.function_call_arguments.done':
                    const toolName = event.name;
                    const callId = event.call_id;
                    let args = {};
                    try { args = JSON.parse(event.arguments || '{}'); } catch (e) {}

                    if (toolName === 'buscar_spool') {
                        const spoolId = args.spool_id;
                        setUIState('thinking', `Obteniendo datos del spool ${spoolId}...`);
                        await executeBuscarSpool(callId, spoolId);
                    } else {
                        sendFunctionOutput(callId, { error: `Capacidad no soportada.` });
                    }
                    break;
            }
        }

        async function executeBuscarSpool(callId, spoolId) {
            try {
                const res = await fetch(`/api/bim/spool/${encodeURIComponent(spoolId)}`);
                if (!res.ok) {
                    sendFunctionOutput(callId, { encontrado: false, mensaje: `No se halló el spool ${spoolId}` });
                    return;
                }

                const data = await res.json();
                const spoolSummary = {
                    spool_id: data.spool_id,
                    metadata: data.metadata ? {
                        tag_gestion: data.metadata['TAG GESTION'] || data.metadata['SPOOL'],
                        area: data.metadata['AREA'] || data.metadata['ÁREA'],
                        isometrico: data.metadata['ID_ISO'] || data.metadata['ISOMÉTRICO'],
                        linea: data.metadata['ID_LINEA'] || data.metadata['LÍNEA'],
                        nps: data.metadata['NPS'] || data.metadata['MAX_NPS_SPOOL'],
                        metros_lineales: data.metadata['METROS_LINEALES']
                    } : null,
                    estado_actual: data.estado_actual || 'SIN REGISTRO',
                    estado_fecha: data.estado_fecha || null,
                    cantidad_elementos_bim: data.elements ? data.elements.length : 0,
                    elementos: data.elements ? data.elements.map(el => ({
                        descripcion: el.descripcion,
                        numero_linea: el.numero_linea
                    })) : []
                };

                sendFunctionOutput(callId, spoolSummary);
            } catch (err) {
                sendFunctionOutput(callId, { error: err.message });
            }
        }

        function sendFunctionOutput(callId, outputObject) {
            if (!dataChannel || dataChannel.readyState !== 'open') return;

            dataChannel.send(JSON.stringify({
                type: 'conversation.item.create',
                item: { type: 'function_call_output', call_id: callId, output: JSON.stringify(outputObject) }
            }));

            dataChannel.send(JSON.stringify({ type: 'response.create' }));
            setUIState('thinking');
        }

        function stopRealtimeSession() {
            isSessionActive = false;
            if (dataChannel) { dataChannel.close(); dataChannel = null; }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localMediaStream) { localMediaStream.getTracks().forEach(t => t.stop()); localMediaStream = null; }
            setUIState('disconnected');
        }
    </script>
</body>
</html>
