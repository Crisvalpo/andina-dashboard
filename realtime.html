<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUKE IWP — Realtime Spool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --bg-card: rgba(18, 26, 47, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-blue: #00d2ff;
            --accent-purple: #7928ca;
            --accent-green: #00e676;
            --accent-amber: #ffab00;
            --accent-red: #ff3d71;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.15), transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(121, 40, 202, 0.1), transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 1rem;
            overflow-x: hidden;
        }

        /* Top Header */
        header {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .brand-info h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .brand-info span {
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .status-badge.connected .status-dot {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-badge.listening .status-dot {
            background-color: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
            animation: pulse-dot 1.2s infinite ease-in-out;
        }

        .status-badge.thinking .status-dot {
            background-color: var(--accent-amber);
            box-shadow: 0 0 10px var(--accent-amber);
            animation: pulse-dot 0.8s infinite ease-in-out;
        }

        .status-badge.speaking .status-dot {
            background-color: var(--accent-purple);
            box-shadow: 0 0 12px var(--accent-purple);
            animation: pulse-dot 0.6s infinite ease-in-out;
        }

        .status-badge.error .status-dot {
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        /* Main Container */
        main {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            margin: auto 0;
        }

        /* Sphere / Orb visualizer container */
        .visualizer-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn-pulse-1, .mic-btn-pulse-2 {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.2) 0%, rgba(121, 40, 202, 0.05) 70%, transparent 100%);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .visualizer-container.listening .mic-btn-pulse-1 {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .visualizer-container.listening .mic-btn-pulse-2 {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 0.6s;
        }

        .visualizer-container.speaking .mic-btn-pulse-1 {
            background: radial-gradient(circle, rgba(121, 40, 202, 0.3) 0%, rgba(0, 210, 255, 0.1) 70%, transparent 100%);
            animation: pulse-ring-fast 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.7); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @keyframes pulse-ring-fast {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Mic Main Button */
        .mic-button {
            position: relative;
            z-index: 10;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(145deg, rgba(20, 30, 55, 0.9), rgba(10, 16, 32, 0.95));
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 2px 5px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .mic-button:hover {
            transform: scale(1.05);
            border-color: var(--accent-blue);
        }

        .mic-button:active {
            transform: scale(0.95);
        }

        .mic-icon {
            font-size: 3.2rem;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.3));
        }

        .visualizer-container.active .mic-button {
            border-color: var(--accent-blue);
            box-shadow: 
                0 0 30px rgba(0, 210, 255, 0.4),
                inset 0 2px 10px rgba(0, 210, 255, 0.4);
        }

        .visualizer-container.speaking .mic-button {
            border-color: var(--accent-purple);
            box-shadow: 
                0 0 35px rgba(121, 40, 202, 0.5),
                inset 0 2px 10px rgba(121, 40, 202, 0.4);
        }

        /* Status Label Below Button */
        .status-text-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .status-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .status-sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
            min-height: 1.35em;
        }

        /* Live Activity Log Card */
        .activity-card {
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 180px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .activity-log {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.4;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 120px;
            scroll-behavior: smooth;
        }

        .log-entry {
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--text-muted);
            word-break: break-word;
        }

        .log-entry.user {
            border-left-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .log-entry.luke {
            border-left-color: var(--accent-purple);
            color: #e2e8f0;
        }

        .log-entry.tool {
            border-left-color: var(--accent-amber);
            font-size: 0.8rem;
            color: #fcd34d;
            font-family: monospace;
        }

        /* Footer */
        footer {
            width: 100%;
            max-width: 440px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.5rem 0;
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        /* Audio Element Hidden */
        #remote-audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Audio Element para reproducir la respuesta hablada -->
    <audio id="remote-audio" autoplay></audio>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-logo">L</div>
            <div class="brand-info">
                <h1>LUKE REALTIME</h1>
                <span>Piloto Spool</span>
            </div>
        </div>
        <div class="status-badge" id="status-badge">
            <div class="status-dot"></div>
            <span id="badge-text">Desconectado</span>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Visualizer & Mic Button -->
        <div class="visualizer-container" id="visualizer">
            <div class="mic-btn-pulse-1"></div>
            <div class="mic-btn-pulse-2"></div>
            <button class="mic-button" id="mic-btn" aria-label="Hablar con Luke">
                <span class="mic-icon" id="mic-icon">🎙️</span>
            </button>
        </div>

        <!-- Status Text -->
        <div class="status-text-container">
            <div class="status-title" id="status-title">Presiona para Hablar</div>
            <div class="status-sub" id="status-sub">Haz clic para iniciar la sesión de voz continua con Luke</div>
        </div>

        <!-- Activity Log Card -->
        <div class="activity-card">
            <div class="activity-header">
                <span>Actividad en tiempo real</span>
                <span id="tool-indicator" style="display:none; color: var(--accent-amber);">⚡ TOOL ACTIVE</span>
            </div>
            <div class="activity-log" id="activity-log">
                <div class="log-entry">Listo para conectar. Presiona el micrófono.</div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <span>Andina Dashboard &bull; IWP Terreno</span>
        <a href="/">Volver al Dashboard &rarr;</a>
    </footer>

    <script>
        // Referencias a elementos DOM
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const visualizer = document.getElementById('visualizer');
        const statusBadge = document.getElementById('status-badge');
        const badgeText = document.getElementById('badge-text');
        const statusTitle = document.getElementById('status-title');
        const statusSub = document.getElementById('status-sub');
        const activityLog = document.getElementById('activity-log');
        const toolIndicator = document.getElementById('tool-indicator');
        const remoteAudio = document.getElementById('remote-audio');

        // Variables de estado WebRTC
        let peerConnection = null;
        let dataChannel = null;
        let localMediaStream = null;
        let isSessionActive = false;

        // Función para agregar logs visuales
        function addLog(text, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = text;
            activityLog.appendChild(entry);
            activityLog.scrollTop = activityLog.scrollHeight;
        }

        // Actualizar UI según el estado
        function setUIState(state, subText = '') {
            statusBadge.className = 'status-badge ' + state;

            switch (state) {
                case 'disconnected':
                    badgeText.innerText = 'Desconectado';
                    statusTitle.innerText = 'Presiona para Hablar';
                    statusSub.innerText = subText || 'Haz clic para iniciar la sesión de voz continua con Luke';
                    visualizer.className = 'visualizer-container';
                    micIcon.innerText = '🎙️';
                    break;
                case 'connecting':
                    badgeText.innerText = 'Conectando...';
                    statusTitle.innerText = 'Estableciendo Conexión';
                    statusSub.innerText = subText || 'Solicitando sesión temporal e instalando canal WebRTC...';
                    visualizer.className = 'visualizer-container active';
                    micIcon.innerText = '⏳';
                    break;
                case 'connected':
                case 'listening':
                    badgeText.innerText = 'Conectado';
                    statusTitle.innerText = 'Escuchando...';
                    statusSub.innerText = subText || 'Háblale a Luke (ej: "Luke, háblame del spool 245")';
                    visualizer.className = 'visualizer-container listening active';
                    micIcon.innerText = '🎙️';
                    break;
                case 'thinking':
                    badgeText.innerText = 'Consultando...';
                    statusTitle.innerText = 'Procesando...';
                    statusSub.innerText = subText || 'Luke está analizando tu consulta...';
                    visualizer.className = 'visualizer-container active';
                    micIcon.innerText = '🧠';
                    break;
                case 'speaking':
                    badgeText.innerText = 'Luke Hablando';
                    statusTitle.innerText = 'Luke respondiendo';
                    statusSub.innerText = subText || 'Escuchando la respuesta por voz...';
                    visualizer.className = 'visualizer-container speaking active';
                    micIcon.innerText = '🔊';
                    break;
                case 'error':
                    badgeText.innerText = 'Error';
                    statusTitle.innerText = 'Error de Conexión';
                    statusSub.innerText = subText || 'Ocurrió un problema al conectar. Intenta nuevamente.';
                    visualizer.className = 'visualizer-container';
                    micIcon.innerText = '⚠️';
                    break;
            }
        }

        // Manejador del botón del micrófono
        micBtn.addEventListener('click', () => {
            if (isSessionActive) {
                stopRealtimeSession();
            } else {
                startRealtimeSession();
            }
        });

        // Iniciar sesión Realtime WebRTC (flujo GA unificado)
        // El navegador envía su SDP offer al backend, que lo reenvía a OpenAI
        // y devuelve el SDP answer. No hay tokens efímeros ni llamadas
        // directas del navegador a api.openai.com.
        async function startRealtimeSession() {
            setUIState('connecting');
            addLog('Iniciando sesión de micrófono y WebRTC...', 'info');

            try {
                // 1. Obtener audio del micrófono
                localMediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                addLog('Micrófono activado.', 'info');

                // 2. Crear WebRTC PeerConnection
                peerConnection = new RTCPeerConnection();

                // Reproducir audio remoto enviado por OpenAI Realtime
                peerConnection.ontrack = (event) => {
                    addLog('Canal de audio de respuesta recibido.', 'info');
                    remoteAudio.srcObject = event.streams[0];
                };

                // Añadir micrófono local a la conexión
                localMediaStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localMediaStream);
                });

                // 3. Crear DataChannel para eventos OpenAI
                dataChannel = peerConnection.createDataChannel('oai-events');
                setupDataChannel(dataChannel);

                // 4. Crear SDP offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                addLog('SDP offer creado. Enviando al backend...', 'info');

                // 5. Enviar SDP offer al backend (que lo reenvía a OpenAI /v1/realtime/calls)
                const sdpResponse = await fetch('/api/realtime/session', {
                    method: 'POST',
                    body: offer.sdp,
                    headers: {
                        'Content-Type': 'application/sdp'
                    }
                });

                if (!sdpResponse.ok) {
                    const errText = await sdpResponse.text();
                    throw new Error(`Error del backend (${sdpResponse.status}): ${errText}`);
                }

                // 6. Establecer SDP answer recibida desde OpenAI (vía backend)
                const answerSdp = await sdpResponse.text();
                await peerConnection.setRemoteDescription({
                    type: 'answer',
                    sdp: answerSdp
                });

                isSessionActive = true;
                setUIState('listening');
                addLog('¡Conectado exitosamente con Luke Realtime!', 'info');

            } catch (err) {
                console.error('[Realtime Error]', err);
                addLog(`Error: ${err.message}`, 'error');
                setUIState('error', err.message);
                stopRealtimeSession();
            }
        }

        // Configurar escuchadores del DataChannel
        function setupDataChannel(dc) {
            dc.onopen = () => {
                addLog('Canal de datos abierto con OpenAI.', 'info');
            };

            dc.onclose = () => {
                addLog('Canal de datos cerrado.', 'info');
            };

            dc.onerror = (err) => {
                console.error('[DataChannel Error]', err);
            };

            dc.onmessage = async (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleRealtimeEvent(msg);
                } catch (e) {
                    console.warn('[DataChannel parse error]', e, event.data);
                }
            };
        }

        // Manejar eventos provenientes de GPT Realtime
        async function handleRealtimeEvent(event) {
            // console.log('[Realtime Event]', event.type, event);

            switch (event.type) {
                case 'input_audio_buffer.speech_started':
                    setUIState('listening', 'Escuchando tu voz...');
                    break;

                case 'input_audio_buffer.speech_stopped':
                    setUIState('thinking', 'Analizando mensaje...');
                    break;

                case 'response.audio_transcript.delta':
                    setUIState('speaking');
                    break;

                case 'response.audio_transcript.done':
                    if (event.transcript) {
                        addLog(`Luke: "${event.transcript}"`, 'luke');
                    }
                    setUIState('listening');
                    break;

                case 'conversation.item.input_audio_transcription.completed':
                    if (event.transcript) {
                        addLog(`Usuario: "${event.transcript}"`, 'user');
                    }
                    break;

                // --- MANEJO DE LLAMADA A HERRAMIENTAS (FUNCTION CALLING) ---
                case 'response.function_call_arguments.done':
                    const toolName = event.name;
                    const callId = event.call_id;
                    let args = {};
                    try {
                        args = JSON.parse(event.arguments || '{}');
                    } catch (e) {}

                    addLog(`Tool call: ${toolName}(${JSON.stringify(args)})`, 'tool');
                    toolIndicator.style.display = 'inline';

                    if (toolName === 'buscar_spool') {
                        const spoolId = args.spool_id;
                        setUIState('thinking', `Consultando spool ${spoolId} en Andina Dashboard...`);
                        await executeBuscarSpool(callId, spoolId);
                    } else {
                        // Herramienta desconocida fallback
                        sendFunctionOutput(callId, { error: `Herramienta ${toolName} no implementada` });
                    }
                    break;

                case 'response.done':
                    toolIndicator.style.display = 'none';
                    break;
            }
        }

        // Ejecutar la tool 'buscar_spool' consultando al backend existente
        async function executeBuscarSpool(callId, spoolId) {
            try {
                addLog(`Consultando /api/bim/spool/${encodeURIComponent(spoolId)}...`, 'info');
                const res = await fetch(`/api/bim/spool/${encodeURIComponent(spoolId)}`);
                
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    sendFunctionOutput(callId, {
                        encontrado: false,
                        mensaje: errData.error || `No se encontró información para el spool ${spoolId}`
                    });
                    return;
                }

                const data = await res.json();
                
                // Formatear resumen limpio para GPT
                const spoolSummary = {
                    spool_id: data.spool_id,
                    metadata: data.metadata ? {
                        tag_gestion: data.metadata['TAG GESTION'] || data.metadata['SPOOL'],
                        area: data.metadata['AREA'] || data.metadata['ÁREA'],
                        isometrico: data.metadata['ID_ISO'] || data.metadata['ISOMÉTRICO'],
                        linea: data.metadata['ID_LINEA'] || data.metadata['LÍNEA'],
                        nps: data.metadata['NPS'] || data.metadata['MAX_NPS_SPOOL'],
                        metros_lineales: data.metadata['METROS_LINEALES']
                    } : null,
                    estado_actual: data.estado_actual || 'SIN REGISTRO DE LOG',
                    estado_fecha: data.estado_fecha || null,
                    cantidad_elementos_bim: data.elements ? data.elements.length : 0,
                    elementos: data.elements ? data.elements.map(el => ({
                        descripcion: el.descripcion,
                        numero_linea: el.numero_linea,
                        cwp: el.cwp
                    })) : []
                };

                addLog(`Spool ${spoolId} obtenido: Estado=${spoolSummary.estado_actual}`, 'tool');

                // Enviar la respuesta de la tool a OpenAI
                sendFunctionOutput(callId, spoolSummary);

            } catch (err) {
                console.error('[Tool execution error]', err);
                sendFunctionOutput(callId, { error: `Error consultando spool: ${err.message}` });
            }
        }

        // Enviar resultado de función a través de DataChannel a OpenAI
        function sendFunctionOutput(callId, outputObject) {
            if (!dataChannel || dataChannel.readyState !== 'open') return;

            const itemMessage = {
                type: 'conversation.item.create',
                item: {
                    type: 'function_call_output',
                    call_id: callId,
                    output: JSON.stringify(outputObject)
                }
            };
            dataChannel.send(JSON.stringify(itemMessage));

            // Solicitar a OpenAI que genere la respuesta basada en el tool output
            const responseCreateMessage = {
                type: 'response.create'
            };
            dataChannel.send(JSON.stringify(responseCreateMessage));
            setUIState('thinking', 'Luke procesando respuesta del spool...');
        }

        // Detener la sesión Realtime WebRTC
        function stopRealtimeSession() {
            isSessionActive = false;
            
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localMediaStream) {
                localMediaStream.getTracks().forEach(track => track.stop());
                localMediaStream = null;
            }

            toolIndicator.style.display = 'none';
            setUIState('disconnected');
            addLog('Sesión de voz finalizada.', 'info');
        }
    </script>
</body>
