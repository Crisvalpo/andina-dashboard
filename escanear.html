<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Escaneo de Lote · Andina</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* =========================================================
   ESCANEO TERRENO - Mobile-first, dedos grandes
   ========================================================= */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body.scan-page{background:radial-gradient(ellipse at top left,#1e1b4b 0%,#0f172a 60%);min-height:100vh;font-family:'Outfit',sans-serif;overscroll-behavior:none}
.scan-shell{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:calc(210px + env(safe-area-inset-bottom))}
/* TOPBAR */
.scan-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(99,102,241,.25);background:rgba(15,23,42,.88);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.scan-topbar .title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;color:#fff}
.scan-topbar .title i{color:#818cf8;font-size:1.15rem}
.scan-topbar .user{text-align:right;font-size:.78rem;color:rgba(255,255,255,.5);line-height:1.4}
.scan-topbar .user strong{color:#e2e8f0}
/* BODY */
.scan-body{padding:14px 14px 0;display:flex;flex-direction:column;gap:12px}
/* CAMARA */
.scan-viewport{border-radius:14px;border:1px solid rgba(99,102,241,.3);overflow:hidden;position:relative;background:#0a0f1e;height:200px}
.scan-viewport video{width:100%;height:100%;object-fit:cover;display:block}
.scan-cam-off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,.3)}
.scan-cam-off i{font-size:2.8rem}
.scan-cam-off p{font-size:.85rem;margin:0}
/* BOTONES (minimo 56px) */
.scan-btn{border:none;border-radius:14px;padding:0 20px;height:56px;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .1s,opacity .15s;user-select:none}
.scan-btn:active{transform:scale(.96);opacity:.85}
.scan-btn-primary{background:#6366f1;color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.scan-btn-ghost{background:rgba(99,102,241,.14);color:#a5b4fc;border:1.5px solid rgba(99,102,241,.35)}
.scan-btn-ok{background:#10b981;color:#052e16;box-shadow:0 4px 20px rgba(16,185,129,.4);height:60px;font-size:1.05rem;border-radius:16px}
.scan-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
.scan-cam-row{display:flex;gap:10px}
.scan-cam-row .scan-btn:first-child{flex:1}
.btn-flip{width:56px;flex-shrink:0;padding:0}
/* INPUT MANUAL */
.scan-manual{display:flex;gap:10px;align-items:stretch}
.scan-manual input{flex:1;height:56px;background:rgba(15,23,42,.7);border:1.5px solid rgba(99,102,241,.3);border-radius:14px;padding:0 16px;color:#f1f5f9;font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:600;-webkit-appearance:none;appearance:none}
.scan-manual input::placeholder{color:rgba(255,255,255,.3)}
.scan-manual input:focus{outline:none;border-color:#6366f1;background:rgba(99,102,241,.08)}
.scan-btn-plus{width:56px;height:56px;flex-shrink:0;border-radius:14px;background:rgba(99,102,241,.14);border:1.5px solid rgba(99,102,241,.35);color:#a5b4fc;font-size:1.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s,opacity .15s;user-select:none}
.scan-btn-plus:active{transform:scale(.93);opacity:.8}
/* LISTA CABECERA */
.scan-lista-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.scan-lista-head h2{font-size:.9rem;color:rgba(255,255,255,.5);font-weight:600;margin:0}
.scan-lista-head h2 span{color:#a5b4fc;font-weight:800;font-size:1.05rem}
.btn-clear{background:none;border:none;color:#f87171;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;padding:8px 4px;display:flex;align-items:center;gap:6px;min-height:44px}
/* ITEMS LISTA */
.scan-lista{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.scan-lista li{background:rgba(15,23,42,.75);border:1px solid rgba(255,255,255,.08);border-left-width:5px;border-radius:14px;padding:14px 16px;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;animation:fadeSlide .22s cubic-bezier(.16,1,.3,1)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scan-lista li.ok{border-left-color:#10b981}
.scan-lista li.warn{border-left-color:#f59e0b;background:rgba(245,158,11,.06)}
.scan-lista li.err{border-left-color:#ef4444;background:rgba(239,68,68,.06)}
.scan-lista li.loading{border-left-color:rgba(255,255,255,.2)}
.item-icon{font-size:1.35rem;flex-shrink:0}
.item-info{flex:1;min-width:0}
.tag{font-weight:800;font-size:1.15rem;color:#f1f5f9;line-height:1.2}
.sub{font-size:.8rem;color:rgba(255,255,255,.45);margin-top:3px;word-break:break-all}
.scan-lista li.ok .sub{color:rgba(16,185,129,.8)}
.scan-lista li.warn .sub{color:rgba(245,158,11,.85)}
.scan-lista li.err .sub{color:rgba(239,68,68,.8)}
.btn-quitar{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#f87171;border-radius:10px;width:44px;height:44px;flex-shrink:0;font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s,background .15s}
.btn-quitar:active{transform:scale(.9);background:rgba(239,68,68,.25)}
.scan-vacio{text-align:center;color:rgba(255,255,255,.25);padding:30px 20px;font-size:.9rem}
/* FOOTER */
.scan-footer{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(10,15,30,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(99,102,241,.25);padding:12px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 32px rgba(0,0,0,.5)}
.scan-footer-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
/* CHIPS ESTADO */
.scan-estados{display:flex;flex-wrap:wrap;gap:8px}
.scan-estado-btn{flex:1 1 calc(50% - 4px);min-width:calc(50% - 4px);height:50px;border-radius:12px;padding:0 12px;background:rgba(99,102,241,.1);border:1.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75);font-size:.95rem;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;user-select:none}
.scan-estado-btn.sel{background:#6366f1;border-color:#6366f1;color:#fff;box-shadow:0 2px 14px rgba(99,102,241,.5);transform:scale(1.02)}
.scan-estado-btn:active{transform:scale(.96)}
/* AUXILIARES */
.scan-center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:16px}
.scan-spinner{width:48px;height:48px;border:3px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bim-scanner-status{font-size:.85rem;padding:6px 14px}
.oculto{display:none!important}
</style>
</head>
<body class="dark-theme scan-page">

<!-- Cargando -->
<div id="v-loading" class="scan-center">
    <div class="scan-spinner"></div>
    <p style="color:rgba(255,255,255,0.5)">Validando sesion...</p>
</div>

<!-- Sesion invalida -->
<div id="v-error" class="scan-center oculto">
    <div style="font-size:3.5rem"><i class="fas fa-lock" style="color:#ef4444"></i></div>
    <h1 style="font-size:1.2rem;margin:0">Sesion no valida o expirada</h1>
    <p style="color:rgba(255,255,255,0.45);max-width:300px;font-size:0.95rem">Pidele a Andi un nuevo enlace por WhatsApp.</p>
</div>

<!-- Resultado OK -->
<div id="v-done" class="scan-center oculto">
    <div style="font-size:4rem"><i class="fas fa-circle-check" style="color:#10b981"></i></div>
    <h1 id="done-title" style="font-size:1.4rem;margin:0"></h1>
    <p id="done-detail" style="color:rgba(255,255,255,0.5);font-size:0.95rem"></p>
    <button class="scan-btn scan-btn-primary" style="max-width:280px;margin-top:8px" onclick="location.reload()">
        <i class="fas fa-qrcode"></i> Escanear otro lote
    </button>
</div>

<!-- Principal -->
<div id="v-main" class="scan-shell oculto">
    <div class="scan-topbar">
        <div class="title"><i class="fas fa-qrcode"></i> Escaneo de lote</div>
        <div class="user" id="user-info">-</div>
    </div>
    <div class="scan-body">
        <!-- Camara -->
        <div class="bim-scanner-viewport scan-viewport">
            <video id="video" class="bim-qr-video" playsinline muted></video>
            <div id="scan-frame" class="bim-scanner-frame oculto">
                <div class="bim-frame-corner bim-frame-tl"></div>
                <div class="bim-frame-corner bim-frame-tr"></div>
                <div class="bim-frame-corner bim-frame-bl"></div>
                <div class="bim-frame-corner bim-frame-br"></div>
                <div class="bim-frame-line"></div>
            </div>
            <div class="bim-scanner-status" id="scan-status"><i class="fas fa-camera"></i> Toca "Iniciar camara"</div>
            <div id="cam-off" class="scan-cam-off"><i class="fas fa-camera"></i><p>Escanea el TAG o el ID_SPOOL</p></div>
            <div class="bim-scanner-result" id="scan-flash" style="display:none">
                <i class="fas fa-check-circle"></i><span id="scan-flash-text"></span>
            </div>
        </div>
        <!-- Botones camara -->
        <div class="scan-cam-row">
            <button id="btn-cam" class="scan-btn scan-btn-primary" onclick="toggleCam()">
                <i class="fas fa-play"></i> Iniciar camara
            </button>
            <button id="btn-flip" class="scan-btn scan-btn-ghost btn-flip oculto" onclick="flipCam()" title="Cambiar camara">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        <!-- Entrada manual -->
        <div class="scan-manual">
            <input id="manual-input" type="text" inputmode="text" autocomplete="off" autocorrect="off"
                   placeholder="Escribe TAG o ID a mano"
                   onkeydown="if(event.key==='Enter')agregarManual()">
            <div class="scan-btn-plus" onclick="agregarManual()" role="button">
                <i class="fas fa-plus"></i>
            </div>
        </div>
        <!-- Cabecera lista -->
        <div class="scan-lista-head">
            <h2>Escaneados: <span id="count">0</span></h2>
            <button class="btn-clear" id="btn-clear" onclick="limpiar()" style="display:none">
                <i class="fas fa-trash-can"></i> Vaciar
            </button>
        </div>
        <ul id="lista" class="scan-lista"></ul>
        <div id="vacio" class="scan-vacio">
            <i class="fas fa-inbox" style="font-size:2.2rem;display:block;margin-bottom:10px;opacity:0.3"></i>
            Aun no has escaneado ningun spool.
        </div>
    </div>
</div>

<!-- Footer fijo -->
<div class="scan-footer" id="footer" style="display:none">
    <div class="scan-footer-inner">
        <div class="scan-estados" id="estados"></div>
        <button id="btn-registrar" class="scan-btn scan-btn-ok" onclick="registrar()">
            Elige el estado a aplicar
        </button>
    </div>
</div>

<canvas id="canvas" class="oculto"></canvas>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const api = (p) => p + (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token);
const el = (id) => document.getElementById(id);

let estados = [], estadoSel = null;
const items = new Map();
let stream = null, scanning = false, ultimoVal = '', ultimoTs = 0, facing = 'environment';

(async () => {
    if (!token) return mostrarError();
    try {
        const r = await fetch(api('/api/escaneo/sesion'));
        const d = await r.json();
        if (!d.success) return mostrarError();
        estados = d.estados || [];
        el('user-info').innerHTML = '<strong>' + d.nombre + '</strong><br>' + (d.rol || '');
        renderEstados();
        el('v-loading').classList.add('oculto');
        el('v-main').classList.remove('oculto');
    } catch (e) { mostrarError(); }
})();

function mostrarError() { el('v-loading').classList.add('oculto'); el('v-error').classList.remove('oculto'); }

function renderEstados() {
    el('estados').innerHTML = estados.map(e =>
        '<button class="scan-estado-btn" data-e="' + e + '" onclick="selEstado(\'' + e.replace(/'/g, "\\'") + '\')">' + e + '</button>'
    ).join('');
}
function selEstado(e) {
    estadoSel = e;
    document.querySelectorAll('.scan-estado-btn').forEach(b => b.classList.toggle('sel', b.dataset.e === e));
    actualizarBotonRegistrar();
}

async function toggleCam() { stream ? detenerCam() : iniciarCam(); }
async function iniciarCam() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
        const v = el('video'); v.srcObject = stream; await v.play();
        scanning = true;
        el('cam-off').classList.add('oculto');
        el('scan-frame').classList.remove('oculto');
        el('scan-status').innerHTML = '<i class="fas fa-crosshairs"></i> Apunta al QR del spool';
        el('btn-cam').innerHTML = '<i class="fas fa-stop"></i> Detener';
        el('btn-cam').classList.replace('scan-btn-primary', 'scan-btn-ghost');
        el('btn-flip').classList.remove('oculto');
        requestAnimationFrame(loop);
    } catch (e) { alert('No se pudo abrir la camara: ' + e.message + '\nUsa la entrada manual.'); }
}
function detenerCam() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    el('cam-off').classList.remove('oculto');
    el('scan-frame').classList.add('oculto');
    el('scan-status').innerHTML = '<i class="fas fa-camera"></i> Camara detenida';
    el('btn-cam').innerHTML = '<i class="fas fa-play"></i> Iniciar camara';
    el('btn-cam').classList.replace('scan-btn-ghost', 'scan-btn-primary');
    el('btn-flip').classList.add('oculto');
}
async function flipCam() { facing = facing === 'environment' ? 'user' : 'environment'; if (stream) { detenerCam(); await iniciarCam(); } }

function loop() {
    if (!scanning) return;
    const v = el('video'), c = el('canvas');
    if (v.readyState === v.HAVE_ENOUGH_DATA) {
        c.width = v.videoWidth; c.height = v.videoHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(v, 0, 0, c.width, c.height);
        const img = ctx.getImageData(0, 0, c.width, c.height);
        const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) {
            const val = extraerValor(code.data.trim());
            const now = Date.now();
            if (val && (val !== ultimoVal || now - ultimoTs > 2500)) {
                ultimoVal = val; ultimoTs = now;
                flash(val); beep(); agregarValor(val);
            }
        }
    }
    requestAnimationFrame(loop);
}
function extraerValor(raw) {
    if (/^https?:\/\//i.test(raw)) {
        try { const u = new URL(raw); return (u.searchParams.get('spool') || u.pathname.split('/').filter(Boolean).pop() || '').trim(); }
        catch (e) { return raw; }
    }
    return raw;
}

function agregarManual() { const inp = el('manual-input'); const v = inp.value.trim(); if (v) { agregarValor(v); inp.value = ''; } }

async function agregarValor(valor) {
    const tmp = 'tmp_' + valor.toLowerCase();
    if (items.has(tmp) || [...items.values()].some(i => (i.buscado || '').toLowerCase() === valor.toLowerCase())) return;
    items.set(tmp, { buscado: valor, tag: valor, status: 'loading', nota: 'Resolviendo...' });
    render();
    try {
        const r = await fetch(api('/api/escaneo/resolver?valor=' + encodeURIComponent(valor)));
        const d = await r.json();
        items.delete(tmp);
        if (!d.encontrado) {
            const k = 'err_' + valor.toLowerCase();
            if (!items.has(k)) items.set(k, { buscado: valor, tag: valor, status: 'err', nota: d.ambiguo ? 'Ambiguo: ' + (d.candidatos||[]).join(', ') : 'No existe en el maestro' });
        } else if (!items.has(d.id_spool)) {
            const yaEnEstado = estadoSel && d.estado_actual && d.estado_actual.toLowerCase() === estadoSel.toLowerCase();
            items.set(d.id_spool, { buscado: valor, tag: d.tag, status: yaEnEstado ? 'warn' : 'ok', nota: d.estado_actual ? ('Actual: ' + d.estado_actual) : 'Sin registros previos' });
        }
        render();
    } catch (e) { items.delete(tmp); render(); }
}

function quitar(id) { items.delete(id); render(); }
function limpiar() { if (confirm('Vaciar toda la lista?')) { items.clear(); render(); } }

function render() {
    const validos = [...items.values()].filter(i => i.status === 'ok' || i.status === 'warn');
    el('count').textContent = validos.length;
    const arr = [...items.entries()];
    el('vacio').style.display = arr.length ? 'none' : 'block';
    el('btn-clear').style.display = arr.length ? 'block' : 'none';
    el('lista').innerHTML = arr.map(function([id, i]) {
        const icon = i.status === 'loading' ? '<i class="fas fa-circle-notch fa-spin" style="color:rgba(255,255,255,0.4)"></i>'
                   : i.status === 'ok'      ? '<i class="fas fa-check-circle" style="color:#10b981"></i>'
                   : i.status === 'warn'    ? '<i class="fas fa-triangle-exclamation" style="color:#f59e0b"></i>'
                   :                          '<i class="fas fa-circle-xmark" style="color:#ef4444"></i>';
        return '<li class="' + i.status + '">' +
            '<div class="item-icon">' + icon + '</div>' +
            '<div class="item-info"><div class="tag">' + i.tag + '</div><div class="sub">' + (i.nota || '') + '</div></div>' +
            '<button class="btn-quitar" onclick="quitar(\'' + id + '\')"><i class="fas fa-xmark"></i></button>' +
            '</li>';
    }).join('');
    el('footer').style.display = validos.length ? 'block' : 'none';
    actualizarBotonRegistrar();
}
function actualizarBotonRegistrar() {
    const validos = [...items.values()].filter(i => i.status === 'ok' || i.status === 'warn');
    const btn = el('btn-registrar');
    btn.disabled = !(validos.length && estadoSel);
    btn.innerHTML = estadoSel
        ? '<i class="fas fa-check-double"></i> Registrar ' + validos.length + ' spool(s) - ' + estadoSel
        : 'Elige el estado a aplicar';
}

async function registrar() {
    const validos = [...items.values()].filter(i => i.status === 'ok' || i.status === 'warn');
    if (!validos.length || !estadoSel) return;
    const btn = el('btn-registrar');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registrando...';
    try {
        const r = await fetch(api('/api/escaneo/registrar'), {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sesion-token': token },
            body: JSON.stringify({ tags: validos.map(i => i.tag), status: estadoSel })
        });
        const d = await r.json();
        if (!d.success) throw new Error(d.error || 'Error');
        detenerCam();
        el('v-main').classList.add('oculto');
        el('done-title').textContent = d.registrados + ' spool(s) - ' + d.status;
        const fallidos = (d.resultados || []).filter(x => !x.ok);
        el('done-detail').textContent = fallidos.length ? (fallidos.length + ' no se pudieron registrar.') : 'Todos registrados correctamente.';
        el('v-done').classList.remove('oculto');
    } catch (e) {
        alert('Error al registrar: ' + e.message);
        btn.disabled = false; actualizarBotonRegistrar();
    }
}

function flash(txt) {
    const f = el('scan-flash'); el('scan-flash-text').textContent = txt;
    f.style.display = 'flex';
    setTimeout(function() { f.style.display = 'none'; }, 600);
}
function beep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 1200; o.type = 'sine';
        g.gain.setValueAtTime(0.14, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.13);
        o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.14);
    } catch (e) {}
}
</script>
</body>
</html>
