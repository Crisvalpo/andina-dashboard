<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Escaneo de Lote · Andina</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
    /* Página standalone: hereda el design system del dashboard (style.css) */
    body.scan-page { background: radial-gradient(ellipse at top left, #1e1b4b 0%, #0f172a 60%); min-height: 100vh; display: flex; flex-direction: column; }
    .scan-shell { width: 100%; max-width: 520px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; padding: 0 0 150px; }

    .scan-topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: rgba(15, 23, 42, 0.6); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); }
    .scan-topbar .title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1rem; }
    .scan-topbar .title i { color: var(--accent); }
    .scan-topbar .user { text-align: right; font-size: 0.72rem; color: var(--text-dim); line-height: 1.3; }
    .scan-topbar .user strong { color: var(--text); }

    .scan-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    /* El viewport de cámara reusa .bim-scanner-viewport / frame / status del dashboard */
    .scan-viewport { border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-lg, 0 20px 50px rgba(0,0,0,0.4)); }
    .scan-cam-off { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-dim); z-index: 3; }
    .scan-cam-off i { font-size: 2.6rem; }

    .scan-btn { border: none; border-radius: 10px; padding: 13px 16px; font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: all 0.15s; }
    .scan-btn:active { transform: scale(0.98); }
    .scan-btn-primary { background: var(--primary); color: #fff; }
    .scan-btn-ghost { background: rgba(99,102,241,0.12); color: var(--primary-light); border: 1px solid rgba(99,102,241,0.3); }
    .scan-btn-ok { background: var(--accent); color: #04231a; }
    .scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .scan-manual { display: flex; gap: 8px; }
    .scan-manual input { flex: 1; background: rgba(15,23,42,0.6); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: 'Outfit', sans-serif; font-size: 1rem; }
    .scan-manual input:focus { outline: none; border-color: var(--primary); }
    .scan-manual button { width: auto; padding: 0 18px; }

    .scan-lista-head { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .scan-lista-head h2 { font-size: 0.85rem; color: var(--text-dim); font-weight: 600; }
    .scan-lista-head .clear { font-size: 0.76rem; color: var(--danger); background: none; border: none; cursor: pointer; font-family: inherit; }
    .scan-lista { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .scan-lista li { background: var(--card); border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px; padding: 11px 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; animation: fade-in-scale 0.25s cubic-bezier(0.16,1,0.3,1); }
    .scan-lista li.ok { border-left-color: var(--accent); }
    .scan-lista li.warn { border-left-color: var(--warning); }
    .scan-lista li.err { border-left-color: var(--danger); }
    .scan-lista li.loading { border-left-color: var(--text-dim); }
    .scan-lista .tag { font-weight: 800; font-size: 1rem; }
    .scan-lista .sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; word-break: break-all; }
    .scan-lista .quitar { background: none; border: none; color: var(--text-dim); font-size: 1.3rem; cursor: pointer; padding: 0 4px; line-height: 1; }
    .scan-vacio { text-align: center; color: var(--text-dim); padding: 22px 10px; font-size: 0.84rem; }

    .scan-footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .scan-footer-inner { max-width: 520px; margin: 0 auto; }
    .scan-estados { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .scan-estado-btn { flex: 1 1 auto; min-width: 30%; background: rgba(99,102,241,0.1); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 9px 10px; font-size: 0.82rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.15s; }
    .scan-estado-btn.sel { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 2px 10px rgba(99,102,241,0.45); }

    .scan-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; gap: 14px; }
    .scan-spinner { width: 42px; height: 42px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .oculto { display: none !important; }
</style>
</head>
<body class="dark-theme scan-page">

<!-- Cargando -->
<div id="v-loading" class="scan-center">
    <div class="scan-spinner"></div>
    <p>Validando sesión…</p>
</div>

<!-- Sesión inválida -->
<div id="v-error" class="scan-center oculto">
    <div style="font-size:3rem"><i class="fas fa-lock" style="color:var(--danger)"></i></div>
    <h1 style="font-size:1.15rem">Sesión no válida o expirada</h1>
    <p style="color:var(--text-dim);max-width:290px">Pídele a Andi un nuevo enlace por WhatsApp: escríbele <em>"quiero reportar un lote"</em>.</p>
</div>

<!-- Resultado -->
<div id="v-done" class="scan-center oculto">
    <div style="font-size:3.4rem"><i class="fas fa-circle-check" style="color:var(--accent)"></i></div>
    <h1 id="done-title" style="font-size:1.25rem"></h1>
    <p id="done-detail" style="color:var(--text-dim)"></p>
    <button class="scan-btn scan-btn-primary" style="max-width:260px;margin-top:10px" onclick="location.reload()"><i class="fas fa-qrcode"></i> Escanear otro lote</button>
</div>

<!-- Principal -->
<div id="v-main" class="scan-shell oculto">
    <div class="scan-topbar">
        <div class="title"><i class="fas fa-qrcode"></i> Escaneo de lote</div>
        <div class="user" id="user-info">—</div>
    </div>

    <div class="scan-body">
        <!-- Cámara (reusa la estética del escáner BIM) -->
        <div class="bim-scanner-viewport scan-viewport">
            <video id="video" class="bim-qr-video" playsinline muted></video>
            <div id="scan-frame" class="bim-scanner-frame oculto">
                <div class="bim-frame-corner bim-frame-tl"></div>
                <div class="bim-frame-corner bim-frame-tr"></div>
                <div class="bim-frame-corner bim-frame-bl"></div>
                <div class="bim-frame-corner bim-frame-br"></div>
                <div class="bim-frame-line"></div>
            </div>
            <div class="bim-scanner-status" id="scan-status"><i class="fas fa-camera"></i> Toca "Iniciar cámara"</div>
            <div id="cam-off" class="scan-cam-off"><i class="fas fa-camera"></i><p style="font-size:0.82rem">Escanea el TAG o el ID_SPOOL</p></div>
            <div class="bim-scanner-result" id="scan-flash" style="display:none;">
                <i class="fas fa-check-circle"></i><span id="scan-flash-text"></span>
            </div>
        </div>

        <div style="display:flex;gap:8px">
            <button id="btn-cam" class="scan-btn scan-btn-primary" onclick="toggleCam()"><i class="fas fa-play"></i> Iniciar cámara</button>
            <button id="btn-flip" class="scan-btn scan-btn-ghost oculto" style="width:auto;padding:0 16px" onclick="flipCam()" title="Cambiar cámara"><i class="fas fa-sync-alt"></i></button>
        </div>

        <div class="scan-manual">
            <input id="manual-input" type="text" placeholder="O escribe el TAG / ID a mano" onkeydown="if(event.key==='Enter')agregarManual()">
            <button class="scan-btn scan-btn-ghost" onclick="agregarManual()"><i class="fas fa-plus"></i></button>
        </div>

        <div class="scan-lista-head">
            <h2>Escaneados: <span id="count">0</span></h2>
            <button class="clear" id="btn-clear" onclick="limpiar()" style="display:none"><i class="fas fa-trash-can"></i> Vaciar</button>
        </div>
        <ul id="lista" class="scan-lista"></ul>
        <div id="vacio" class="scan-vacio">Aún no has escaneado ningún spool.</div>
    </div>

    <div class="scan-footer" id="footer" style="display:none">
        <div class="scan-footer-inner">
            <div class="scan-estados" id="estados"></div>
            <button id="btn-registrar" class="scan-btn scan-btn-ok" onclick="registrar()">Elige el estado a aplicar</button>
        </div>
    </div>
</div>

<canvas id="canvas" class="oculto"></canvas>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const api = (p) => p + (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token);
const el = (id) => document.getElementById(id);

let estados = [], estadoSel = null;
const items = new Map();
let stream = null, scanning = false, ultimoVal = '', ultimoTs = 0, facing = 'environment';

(async () => {
    if (!token) return mostrarError();
    try {
        const r = await fetch(api('/api/escaneo/sesion'));
        const d = await r.json();
        if (!d.success) return mostrarError();
        estados = d.estados || [];
        el('user-info').innerHTML = `<strong>${d.nombre}</strong><br>${d.rol || ''}`;
        renderEstados();
        el('v-loading').classList.add('oculto');
        el('v-main').classList.remove('oculto');
    } catch (e) { mostrarError(); }
})();

function mostrarError() { el('v-loading').classList.add('oculto'); el('v-error').classList.remove('oculto'); }

function renderEstados() {
    el('estados').innerHTML = estados.map(e =>
        `<button class="scan-estado-btn" data-e="${e}" onclick="selEstado('${e.replace(/'/g,"\\'")}')">${e}</button>`).join('');
}
function selEstado(e) {
    estadoSel = e;
    document.querySelectorAll('.scan-estado-btn').forEach(b => b.classList.toggle('sel', b.dataset.e === e));
    actualizarBotonRegistrar();
}

async function toggleCam() { stream ? detenerCam() : iniciarCam(); }
async function iniciarCam() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
        const v = el('video'); v.srcObject = stream; await v.play();
        scanning = true;
        el('cam-off').classList.add('oculto');
        el('scan-frame').classList.remove('oculto');
        el('scan-status').innerHTML = '<i class="fas fa-crosshairs"></i> Apunta al QR del spool';
        el('btn-cam').innerHTML = '<i class="fas fa-stop"></i> Detener';
        el('btn-cam').classList.replace('scan-btn-primary', 'scan-btn-ghost');
        el('btn-flip').classList.remove('oculto');
        requestAnimationFrame(loop);
    } catch (e) { alert('No se pudo abrir la cámara: ' + e.message + '\nUsa la entrada manual.'); }
}
function detenerCam() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    el('cam-off').classList.remove('oculto');
    el('scan-frame').classList.add('oculto');
    el('scan-status').innerHTML = '<i class="fas fa-camera"></i> Cámara detenida';
    el('btn-cam').innerHTML = '<i class="fas fa-play"></i> Iniciar cámara';
    el('btn-cam').classList.replace('scan-btn-ghost', 'scan-btn-primary');
    el('btn-flip').classList.add('oculto');
}
async function flipCam() { facing = facing === 'environment' ? 'user' : 'environment'; if (stream) { detenerCam(); await iniciarCam(); } }

function loop() {
    if (!scanning) return;
    const v = el('video'), c = el('canvas');
    if (v.readyState === v.HAVE_ENOUGH_DATA) {
        c.width = v.videoWidth; c.height = v.videoHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(v, 0, 0, c.width, c.height);
        const img = ctx.getImageData(0, 0, c.width, c.height);
        const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) {
            const val = extraerValor(code.data.trim());
            const now = Date.now();
            if (val && (val !== ultimoVal || now - ultimoTs > 2500)) {
                ultimoVal = val; ultimoTs = now;
                flash(val); beep(); agregarValor(val);
            }
        }
    }
    requestAnimationFrame(loop);
}
function extraerValor(raw) {
    if (/^https?:\/\//i.test(raw)) {
        try { const u = new URL(raw); return (u.searchParams.get('spool') || u.pathname.split('/').filter(Boolean).pop() || '').trim(); }
        catch (e) { return raw; }
    }
    return raw;
}

function agregarManual() { const inp = el('manual-input'); const v = inp.value.trim(); if (v) { agregarValor(v); inp.value = ''; } }

async function agregarValor(valor) {
    const tmp = 'tmp_' + valor.toLowerCase();
    if (items.has(tmp) || [...items.values()].some(i => (i.buscado || '').toLowerCase() === valor.toLowerCase())) return;
    items.set(tmp, { buscado: valor, tag: valor, status: 'loading', nota: 'Resolviendo…' });
    render();
    try {
        const r = await fetch(api('/api/escaneo/resolver?valor=' + encodeURIComponent(valor)));
        const d = await r.json();
        items.delete(tmp);
        if (!d.encontrado) {
            const k = 'err_' + valor.toLowerCase();
            if (!items.has(k)) items.set(k, { buscado: valor, tag: valor, status: 'err', nota: d.ambiguo ? 'Ambiguo: ' + (d.candidatos||[]).join(', ') : 'No existe en el maestro' });
        } else if (!items.has(d.id_spool)) {
            const yaEnEstado = estadoSel && d.estado_actual && d.estado_actual.toLowerCase() === estadoSel.toLowerCase();
            items.set(d.id_spool, { buscado: valor, tag: d.tag, status: yaEnEstado ? 'warn' : 'ok', nota: d.estado_actual ? ('Actual: ' + d.estado_actual) : 'Sin registros previos' });
        }
        render();
    } catch (e) { items.delete(tmp); render(); }
}

function quitar(id) { items.delete(id); render(); }
function limpiar() { items.clear(); render(); }

function render() {
    const validos = [...items.values()].filter(i => i.status === 'ok' || i.status === 'warn');
    el('count').textContent = validos.length;
    const arr = [...items.entries()];
    el('vacio').style.display = arr.length ? 'none' : 'block';
    el('btn-clear').style.display = arr.length ? 'block' : 'none';
    el('lista').innerHTML = arr.map(([id, i]) => `
        <li class="${i.status}">
            <div>
                <div class="tag">${i.status === 'loading' ? '⏳ ' : ''}${i.tag}</div>
                <div class="sub">${i.nota || ''}</div>
            </div>
            <button class="quitar" onclick="quitar('${id}')">&times;</button>
        </li>`).join('');
    el('footer').style.display = validos.length ? 'block' : 'none';
    actualizarBotonRegistrar();
}
function actualizarBotonRegistrar() {
    const validos = [...items.values()].filter(i => i.status === 'ok' || i.status === 'warn');
    const btn = el('btn-registrar');
    btn.disabled = !(validos.length && estadoSel);
    btn.innerHTML = estadoSel ? `<i class="fas fa-check-double"></i> Registrar ${validos.length} spool(s) → ${estadoSel}` : 'Elige el estado a aplicar';
}

async function registrar() {
    const validos = [...items.values()].filter(i => i.status === 'ok' || i.status === 'warn');
    if (!validos.length || !estadoSel) return;
    const btn = el('btn-registrar');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registrando…';
    try {
        const r = await fetch(api('/api/escaneo/registrar'), {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-sesion-token': token },
            body: JSON.stringify({ tags: validos.map(i => i.tag), status: estadoSel })
        });
        const d = await r.json();
        if (!d.success) throw new Error(d.error || 'Error');
        detenerCam();
        el('v-main').classList.add('oculto');
        el('done-title').textContent = `${d.registrados} spool(s) → ${d.status}`;
        const fallidos = (d.resultados || []).filter(x => !x.ok);
        el('done-detail').textContent = fallidos.length ? `${fallidos.length} no se pudieron registrar.` : 'Todos registrados correctamente.';
        el('v-done').classList.remove('oculto');
    } catch (e) {
        alert('Error al registrar: ' + e.message);
        btn.disabled = false; actualizarBotonRegistrar();
    }
}

function flash(txt) {
    const f = el('scan-flash'); el('scan-flash-text').textContent = txt;
    f.style.display = 'flex';
    setTimeout(() => { f.style.display = 'none'; }, 550);
}
function beep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 1200; o.type = 'sine';
        g.gain.setValueAtTime(0.14, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.13);
        o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.14);
    } catch (e) {}
}
</script>
</body>
</html>
